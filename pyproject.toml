[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bigfix-root-mcp"
version = "1.0.0"
description = "A minimal read-only MCP server around the besapi library (BigFix REST API)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "JGStew", email = "admin@jgstew.com" },
]
keywords = ["bigfix", "mcp", "besapi", "rest-api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "besapi>=4.1.5",
    # static relevance analysis (advisory pre-flight, analyze_relevance tool);
    # pure stdlib, stdout-silent, safe inside a stdio server
    "bigfix-relevance-analyzer>=1.38.1,<2",
    # fast client relevance evaluation with the qna binary on containers or
    # inventoried hosts (qna.py, evaluate_client_relevance_qna)
    "bigfix-remote-client-relevance>=1.5.4,<2",
    # session relevance evaluation (sessionrelevance.py); besapi remains the
    # client for every other REST call. 0.5.1: an unclosed sync client no
    # longer hangs interpreter exit, which the server relies on. 0.5.2: when
    # Explorer comes back during the no-Explorer form fallback, a query that
    # is itself valid JSON ("Invalid JSON") is retried over JSON too. Capped
    # at <2, not <1: 1.x is announced as keeping the 0.5 contract.
    "bigfix-remote-session-relevance>=0.5.2,<2",
    "fastmcp==4.1.0",
    # imported directly by src/ (besxml.py, errors.py, server.py). They do
    # arrive transitively via besapi/fastmcp today, but a package should
    # depend on what it imports rather than on another package's dependency
    # list staying the same.
    "lxml",
    "pydantic",
    "requests",
]

# qna: kept only so existing `bigfix-root-mcp[qna]` installs keep resolving;
# bigfix-remote-client-relevance is now a base dependency.
[project.optional-dependencies]
qna = ["bigfix-remote-client-relevance>=1.5.4,<2"]

[project.urls]
Homepage = "https://github.com/jgstew/bigfix-root-mcp"
Repository = "https://github.com/jgstew/bigfix-root-mcp"

[project.scripts]
bigfix-root-mcp = "bigfix_root_mcp.server:main"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

# hatchling ships every file inside the package directory, so the MCP resource
# markdown (read at runtime via importlib.resources) needs no package-data rule
# of its own -- unlike setuptools, which dropped it without one.
[tool.hatch.build.targets.wheel]
packages = ["src/bigfix_root_mcp"]

[tool.uv]
required-version = ">=0.12"
# Delay dependency resolution by 7 days so newly-published (possibly broken
# or compromised) releases aren't picked up immediately. Matches the
# `cooldown` on the uv/github-actions ecosystems in .github/dependabot.yml.
exclude-newer = "7 days"
# First-party bigfix-* packages (same author as this project) have no
# cooldown at all (`false`, supported since uv 0.12): it guards against
# compromised *third-party* releases, and these are released together with
# changes here - a fix published minutes ago is often the one this project
# needs next. Same exemption as `cooldown.exclude` in .github/dependabot.yml.
exclude-newer-package = { bigfix-relevance-analyzer = false, bigfix-remote-client-relevance = false, bigfix-remote-session-relevance = false }
# fastmcp 4.0.0b1 is a meta-package over fastmcp-slim; uv only allows
# prereleases for explicitly named packages, so the transitive dep has to be
# named here to be resolvable at all.
#
# Deliberately `>=` and not `==`: the point of this entry is to *name*
# fastmcp-slim, not to pin it. fastmcp pins its own matching
# fastmcp-slim[client]==<same version>, so the exact version is already
# decided by the `fastmcp==` pin in [project.dependencies] above. Pinning it
# again here made the two impossible to bump together -- Dependabot's
# fastmcp 4.0.0b1 -> 4.0.0b3 PR failed with dependency_file_not_resolvable,
# because b3 requires fastmcp-slim==4.0.0b3 while this line still said b1.
constraint-dependencies = ["fastmcp-slim>=4.0.0b1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "src" -> the package itself, so the tests import from the source tree rather
#          than a stale install
# "."   -> `from tests.conftest import ...`, which otherwise only resolves
#          because `python -m pytest` happens to put the cwd on sys.path
pythonpath = ["src", "."]

[tool.mypy]
python_version = "3.11"
files = ["src"]

# besapi ships no py.typed marker and has no stubs on typeshed, so every
# symbol from it is Any. Scoped to the one package rather than set globally
# so a genuinely missing import elsewhere still gets reported.
[[tool.mypy.overrides]]
module = ["besapi.*"]
ignore_missing_imports = true

# optional [qna] extra: not installed in the dev environment on purpose (tests
# fake it at the sys.modules seam), so mypy cannot follow the import
[[tool.mypy.overrides]]
module = ["bigfix_remote_client_relevance.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
# same width the black hook was configured with before ruff replaced it
line-length = 100

[tool.ruff.lint]
# The PL* families are ruff's port of pylint, which is why there is no
# separate pylint hook: on this codebase they report the same findings, and
# pylint's one unique finding (W0706 on the `except ToolError: raise` in
# errors.py) is a false positive -- that clause is load-bearing, it shadows
# the `except _handled` below it so ToolErrors pass through untranslated.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "A",    # flake8-builtins (shadowing)
    "C4",   # flake8-comprehensions
    "G",    # flake8-logging-format
    "ISC",  # implicit str concat
    "LOG",  # flake8-logging
    "PIE",  # flake8-pie
    "RET",  # flake8-return
    "T20",  # flake8-print (stdout belongs to the MCP stdio transport)
    "TRY",  # tryceratops
    "PLC",  # pylint conventions
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
]

ignore = [
    # Deliberately not enabled, with reasons:
    #   PLR2004 (magic values) - 41 hits, all of them test assertions where the
    #           literal is the point of the assertion.
    #   PLR0913/PLR0917 (too many arguments) - an MCP tool's parameter list is
    #           its published schema; the count is not a design choice.
    #   ARG002 (unused arguments) - pytest fixtures requested for their side
    #           effects rather than their value.
    # TRY003 is ignored here rather than left out of `select` so the rest of the
    # TRY family still applies: this server deliberately raises ToolError with
    # long, self-contained messages, because a ToolError message is the only
    # part of a failure the MCP client is guaranteed to see.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# SIM300: the subset assertions here (`EXPECTED_RESOURCES <= uris`) are set
# comparisons, not Yoda conditions -- "expected is a subset of what we got" is
# the direction that reads correctly, and SIM300's suggested `uris >=
# EXPECTED_RESOURCES` inverts the emphasis for no gain.
"tests/*" = [
    "S101",
    "SIM300",
    # Imports deferred into a test body on purpose: these tests reload a module
    # (or import it for the first time) after setting environment variables, so
    # import time is what is under test.
    "PLC0415",
]
